name: Release APK

on:
  push:
    branches: [master]
    paths: ["app/build.gradle.kts"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.ref_type == 'tag' && 1 || 2 }}

      - name: Detect version change
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            CURRENT=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            PREV=$(git show HEAD~1:app/build.gradle.kts 2>/dev/null | grep -oP 'versionName\s*=\s*"\K[^"]+' || echo "")
            if [ "$CURRENT" = "$PREV" ]; then
              echo "No version change, skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif git ls-remote --tags origin "v$CURRENT" | grep -q .; then
              echo "Tag v$CURRENT already exists, skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "New version: $CURRENT"
              echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create tag
        if: steps.version.outputs.skip == 'false' && github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        if: steps.version.outputs.skip == 'false'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Write keystore properties
        if: steps.version.outputs.skip == 'false'
        run: |
          echo 'storeFile=release.jks' > keystore.properties
          echo 'storePassword=${{ secrets.KEYSTORE_PASS }}' >> keystore.properties
          echo 'keyAlias=${{ secrets.KEY_ALIAS }}' >> keystore.properties
          echo 'keyPassword=${{ secrets.KEY_PASS }}' >> keystore.properties

      - name: Generate Gradle wrapper
        if: steps.version.outputs.skip == 'false'
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Build release APK
        if: steps.version.outputs.skip == 'false'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Write release notes
        if: steps.version.outputs.skip == 'false'
        run: git log -1 --pretty=format:%B > release_notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
          body_path: release_notes.md

      - name: Prune old release assets
        if: steps.version.outputs.skip == 'false'
        run: |
          latest=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            [ "$tag" = "$latest" ] && continue
            gh release view "$tag" --json assets -q '.assets[].name' | while read -r a; do
              gh release delete-asset "$tag" "$a" --yes
            done
          done
        env:
          GH_TOKEN: ${{ github.token }}